<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ST-IAT Results</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="container" id="results-container">
        <h1>IAT Complete</h1>
        <p class="subtitle" id="results-subtitle"></p>

        <!-- D-Score display -->
        <div class="card">
            <div class="d-score-display">
                <div class="d-score-value" id="d-score-value">—</div>
                <div class="d-score-label">D-Score</div>
                <div class="d-score-interpretation" id="d-interpretation"></div>
                <div class="d-score-effect" id="d-effect"></div>
            </div>
        </div>

        <!-- Summary stats -->
        <div class="card">
            <h2>Summary Statistics</h2>
            <div class="stat-grid">
                <div class="stat-item">
                    <div class="stat-value" id="stat-mean-compat">—</div>
                    <div class="stat-label">Mean RT (Compatible)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-mean-incompat">—</div>
                    <div class="stat-label">Mean RT (Incompatible)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-error-rate">—</div>
                    <div class="stat-label">Error Rate</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-mean-rt">—</div>
                    <div class="stat-label">Overall Mean RT</div>
                </div>
            </div>
        </div>

        <!-- Data quality flags -->
        <div class="card" id="flags-card" style="display:none;">
            <h2>Data Quality Flags</h2>
            <ul class="flags-list" id="flags-list"></ul>
        </div>

        <!-- Session info -->
        <div class="card">
            <h2>Session Info</h2>
            <div class="session-info" id="session-info"></div>
        </div>

        <!-- Actions -->
        <div class="btn-group">
            <button class="btn btn-secondary" id="btn-export-json">Export JSON</button>
            <button class="btn btn-secondary" id="btn-export-csv">Export CSV</button>
        </div>
        <div style="margin-top: 12px;">
            <a href="index.html" class="btn btn-primary" style="display:block; text-align:center;">New Session</a>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/scoring.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
      const session = IATStorage.getSession();

      if (!session || !session.trials.length) {
        document.getElementById('results-container').innerHTML =
          '<h1>No Data</h1><p class="subtitle">No IAT session found.</p><a href="index.html" class="btn btn-primary" style="display:block;text-align:center;margin-top:24px;">Start New Session</a>';
        return;
      }

      // Compute scores
      const results = IATScoring.compute(session.trials);

      // Ensure session is marked complete
      if (!session.completed) {
        IATStorage.completeSession(results.dScore, results.errorRate, results.meanRT);
      }

      // Version label
      const versionLabels = {
        other_congolese: 'IAT 1: Other Congolese',
        congolese_state: 'IAT 2: Congolese State',
      };
      document.getElementById('results-subtitle').textContent =
        versionLabels[session.iat_version] || session.iat_version;

      // D-Score
      const dEl = document.getElementById('d-score-value');
      dEl.textContent = results.dScore.toFixed(3);
      if (results.dScore > 0.15) dEl.classList.add('positive');
      else if (results.dScore < -0.15) dEl.classList.add('negative');
      else dEl.classList.add('neutral');

      document.getElementById('d-interpretation').textContent = results.interpretation;
      document.getElementById('d-effect').textContent = 'Effect size: ' + results.effectSize;

      // Stats
      document.getElementById('stat-mean-compat').textContent = results.meanCompatible + 'ms';
      document.getElementById('stat-mean-incompat').textContent = results.meanIncompatible + 'ms';
      document.getElementById('stat-error-rate').textContent = (results.errorRate * 100).toFixed(1) + '%';
      document.getElementById('stat-mean-rt').textContent = results.meanRT + 'ms';

      // Flags
      if (results.flags.length > 0) {
        document.getElementById('flags-card').style.display = 'block';
        document.getElementById('flags-list').innerHTML =
          results.flags.map(f => '<li>' + f + '</li>').join('');
      }

      // Session info
      const orderLabels = { A: 'Order A (Compatible first)', B: 'Order B (Incompatible first)' };
      document.getElementById('session-info').innerHTML = `
        <p><strong>Respondent:</strong> ${session.respondent_id}</p>
        <p><strong>Block Order:</strong> ${orderLabels[session.block_order] || session.block_order}</p>
        <p><strong>Language:</strong> ${session.language}</p>
        <p><strong>Total Trials:</strong> ${session.trials.length}</p>
        <p><strong>Started:</strong> ${new Date(session.start_time).toLocaleString()}</p>
        ${session.end_time ? '<p><strong>Ended:</strong> ' + new Date(session.end_time).toLocaleString() + '</p>' : ''}
      `;

      // Export buttons
      document.getElementById('btn-export-json').addEventListener('click', () => {
        const json = IATStorage.exportJSON();
        const filename = 'iat_' + session.respondent_id + '_' + session.iat_version + '.json';
        IATStorage.download(json, filename, 'application/json');
      });

      document.getElementById('btn-export-csv').addEventListener('click', () => {
        const csv = IATStorage.exportCSV();
        const filename = 'iat_' + session.respondent_id + '_' + session.iat_version + '.csv';
        IATStorage.download(csv, filename, 'text/csv');
      });
    });
    </script>
</body>
</html>
